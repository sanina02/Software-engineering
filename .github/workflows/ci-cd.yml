name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff (PEP8)
        run: ruff check .

      - name: Run tests with pytest
        run: pytest -q

      - name: Build Docker image
        run: docker build -t traffic-detector:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag traffic-detector:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/traffic-violation-detector:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/traffic-violation-detector:latest
